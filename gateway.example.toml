# pds-gateway — every setting has a GATEWAY_* environment equivalent, and the
# environment always wins. Durations accept "30", "500ms", "5m", "1h30m".

[server]
bind = "0.0.0.0:2583"
# How the world reaches the gateway. Used for describeServer and the DID document.
public_url = "https://rocksky.social"
did = "did:web:rocksky.social"
trust_forwarded_headers = true
shutdown_grace = "20s"

[gateway]
# Domains the gateway owns. It allocates handles under these and is the
# authority that stops two nodes issuing the same one.
handle_domains = ["rocksky.social"]
# Where requests go when nothing identifies an account.
default_node = "local"
# least-accounts | round-robin | weighted | pinned
placement = "least-accounts"
reservation_ttl = "10m"
allow_signups = true
# Try every node on login, since an email cannot be resolved to a DID.
broadcast_login = true
honor_proxy_header = true
reserved_handles = ["admin", "api", "mod", "pds", "root", "support", "www"]

[delegate]
# The gateway answers handle resolution for the whole namespace, so each PDS can
# set ATOLL_HANDLE_DELEGATES=https://rocksky.social and stop allocating
# colliding handles. On a miss the gateway asks the nodes, which are
# authoritative for their own accounts.
enabled = true
fan_out = true
# The fan-out is parallel, so this bounds the slowest single node, not the sum.
# It must stay under the caller's budget: atoll allows a delegate 2s to connect
# and 3s to answer, and this runs on the TLS handshake path. Nodes on home
# connections need more than a LAN would, so 2s rather than a few hundred ms.
ask_timeout = "2s"
cache_ttl = "5m"
# Approve on-demand TLS for handles that actually exist.
tls_check = true

[identity]
plc_directory_url = "https://plc.directory"
handle_cache_ttl = "5m"
handle_negative_cache_ttl = "30s"
did_cache_ttl = "10m"
route_cache_ttl = "5m"
cache_capacity = 100000
dns_resolution = true
well_known_resolution = true
# Empty uses the system resolver.
dns_nameservers = []

[upstream]
# Nodes are reached across the public internet, so these allow for WAN latency
# and for boards on domestic upload links.
connect_timeout = "10s"
request_timeout = "60s"
# Blobs and CAR transfers.
transfer_timeout = "10m"
pool_idle_timeout = "90s"
pool_max_idle_per_host = 32
max_buffered_body_bytes = 1048576

[health]
interval = "15s"
# A probe across the internet to a small board, not a LAN round trip.
timeout = "5s"
failure_threshold = 3
success_threshold = 2
probe_path = "/xrpc/_health"
# A node that failed its probe may still serve reads.
route_to_unhealthy = true

[firehose]
# multiplex | passthrough | off
mode = "multiplex"
replay_buffer = 8192
subscriber_queue = 1024
reconnect_min_backoff = "500ms"
reconnect_max_backoff = "30s"

[store]
path = "data/gateway.sqlite3"
max_connections = 8
sweep_interval = "60s"

[redis]
# Optional. Leave unset for a single gateway: SQLite stays the source of truth
# and caches live in-process. Set it to share the resolution cache and handle
# reservations across several gateway replicas.
# url = "redis://127.0.0.1:6379"
key_prefix = "pdsgw"
fail_open = true
connect_timeout = "3s"
response_timeout = "2s"

[admin]
# Unset disables /admin/*.
token = "change-me"
metrics = true

# --- the fleet -------------------------------------------------------------
# `url` is how the gateway reaches a node; `public_host` is what that node
# publishes in DID documents.
#
# The nodes are on the public internet, each behind its own hostname and its own
# TLS, so for them the two are the same host and `url` MUST be https:// — the
# gateway forwards the client's Authorization header on this hop. The gateway
# warns at startup about any plaintext http:// node that is not loopback or
# RFC1918.
#
# The exception is the PDS sharing this machine: the gateway owns the public
# hostname and port 2583, so that PDS binds to 127.0.0.1:2584 and is reached
# over loopback while still publishing "rocksky.social".
[[nodes]]
name = "local"
url = "http://127.0.0.1:2584"
public_host = "rocksky.social"
did = "did:web:rocksky.social"
weight = 1
accepts_signups = true

[[nodes]]
name = "radxa"
url = "https://radxa.rocksky.social"
public_host = "radxa.rocksky.social"
did = "did:web:radxa.rocksky.social"
weight = 2
accepts_signups = true

[[nodes]]
name = "raspberrypi4"
url = "https://raspberrypi4.rocksky.social"
public_host = "raspberrypi4.rocksky.social"
did = "did:web:raspberrypi4.rocksky.social"
weight = 1
accepts_signups = true

[[nodes]]
name = "orangepi-zero-3w"
url = "https://orangepi-zero-3w.rocksky.social"
public_host = "orangepi-zero-3w.rocksky.social"
did = "did:web:orangepi-zero-3w.rocksky.social"
weight = 1
# A small board can host existing accounts without taking new ones.
accepts_signups = false
max_accounts = 200
